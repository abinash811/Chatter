name: CI

# Exists specifically because none of the bugs fixed in the "real test
# run" (see README.md) were catchable by reading code or by TypeScript
# alone — every RLS policy silently failing to create, a stale SDK
# version, boundary type mismatches. All of them only surfaced by
# actually running the app against a real database. This workflow makes
# that automatic on every push instead of dependent on someone asking
# for a manual test run.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # POSTGRES_USER becomes a SUPERUSER on this image, and a
        # superuser bypasses RLS unconditionally, regardless of FORCE
        # ROW LEVEL SECURITY — using it directly here would make
        # verify-rls.mjs pass vacuously even if every policy were
        # broken, exactly the bug this workflow exists to catch. Keep
        # this as the admin connection only; the app steps below use a
        # separately created non-superuser role, same as local setup.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatter
      DATABASE_URL: postgresql://chatter:chatter@localhost:5432/chatter
      ANTHROPIC_API_KEY: test-placeholder-key
      AUTH_SECRET: test-placeholder-secret-value-not-real
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Guardrail checks (tenant isolation, no vertical logic, no client secrets, design tokens)
        run: npm run check:all

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (tests/unit/ — lib/ai/'s engine logic, schemas, utils)
        # Fast, isolated, no real database or Claude API call — runs
        # before the slower DB/build/E2E steps below so a regression in
        # the engine itself (the chat loop, tool registry, the Anthropic
        # SDK request/response mapping) fails in seconds, not minutes.
        run: npm run test:unit

      - name: Create non-superuser app role and hand it the database
        run: |
          psql "$ADMIN_DATABASE_URL" -c "CREATE ROLE chatter LOGIN PASSWORD 'chatter' CREATEDB;"
          psql "$ADMIN_DATABASE_URL" -c "ALTER DATABASE chatter OWNER TO chatter;"
          psql "$ADMIN_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply base schema (Prisma)
        run: npx prisma migrate deploy

      - name: Apply RLS + pgvector migrations
        # Same command Render's preDeployCommand runs (render.yaml,
        # ADR 0005) — CI exercises the identical deploy path, not a
        # separate psql-based approximation of it.
        run: node scripts/apply-sql-migrations.mjs

      - name: Verify tenant isolation (guardrail #1)
        run: node scripts/verify-rls.mjs

      - name: Build
        run: npm run build

      - name: Start server and run browser canary
        run: |
          npm run start &
          for i in $(seq 1 30); do curl -sf "$APP_BASE_URL/login" -o /dev/null && break; sleep 1; done
          npm run canary

      - name: Run the persistent E2E regression suite
        # tests/e2e/ — real signup/login/bot-editor/error-boundary flows,
        # not just canary.mjs's smoke check. Every assertion in here
        # caught a real bug when first written as a throwaway verification
        # script; kept permanently now instead of re-discovering the same
        # regressions later. Reuses the server already started above.
        run: npm run test:e2e

      - name: Run visual regression suite (tests/visual/)
        # Was continue-on-error: true — checked run 36171075919 (commit
        # c43adb0) by hand at the step level (not just overall job
        # status, which continue-on-error can mask): this step's own
        # conclusion was "success" on GitHub's real runner, confirming
        # the baselines generated in this project's sandboxed dev
        # environment do match CI's actual render. Flipped to blocking.
        id: visual
        run: npm run test:visual
        env:
          APP_BASE_URL: http://localhost:3000

      - name: Upload visual diff artifacts on failure
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7

      - name: Stop server
        if: always()
        run: kill %1 || true
