<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e5e7eb; }
.page-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e5e5e5; color: #065f46; }

/* ── Shell ─────────────────────────────────────────── */
.shell { display: flex; height: 520px; background: #fff; }
.sidebar { width: 224px; flex-shrink: 0; border-right: 1px solid #e5e5e5; padding: 16px 12px; }
.brand-row { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 8px; }
.brand-icon { width: 22px; height: 22px; background: #065f46; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.brand-name { font-size: 13px; font-weight: 600; color: #0a0a0c; }
.nav-item { height: 32px; display: flex; align-items: center; padding: 0 8px; border-radius: 6px; font-size: 13px; color: #0a0a0c; background: #f5f5f5; font-weight: 500; }

.main { flex: 1; padding: 24px 32px; overflow: hidden; }
.main-header { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-bottom: 4px; }
.page-title { font-size: 18px; font-weight: 600; color: #0a0a0c; }
.bot-count { font-size: 12px; color: #737373; margin-left: 8px; font-weight: 400; }
.new-bot-row { display: flex; gap: 8px; }
.field-input-sm { height: 32px; border: 1px solid #e5e5e5; border-radius: 6px; padding: 0 10px; font-size: 13px; width: 160px; }
.btn-sm { height: 32px; padding: 0 12px; background: #065f46; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; }

/* Real CARE Table (components/ui/table.tsx, ADR 0008) via
   components/console/BotsTable.tsx — not the old borderless div-list. */
.list { margin-top: 12px; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
.thead-row { display: flex; align-items: center; height: 40px; padding: 0 8px; background: #fafafa; border-bottom: 1px solid #e5e5e5; font-size: 13px; font-weight: 500; color: #0a0a0c; }
.th-name { flex: 1; padding-left: 8px; }
.th-status { width: 140px; }
.th-created { width: 100px; text-align: right; padding-right: 24px; }
.row { display: flex; align-items: center; height: 40px; padding: 0 8px; border-bottom: 1px solid #e5e5e5; font-size: 13px; cursor: pointer; }
.row:last-child { border-bottom: none; }
.row:hover { background: #fafafa; }
.row-name { font-weight: 500; color: #0a0a0c; flex: 1; display: flex; align-items: center; gap: 10px; padding-left: 8px; }
.row-icon { width: 28px; height: 28px; border-radius: 6px; background: #ecfdf5; color: #065f46; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; flex-shrink: 0; }
.row-status { width: 140px; }
.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; display: inline-block; }
.badge-published { background: #065f46; color: #fff; }
.badge-draft { background: #f5f5f5; color: #737373; }
.row-meta { color: #a3a3a3; font-size: 12px; font-variant-numeric: tabular-nums; width: 76px; text-align: right; }
.row-chevron { color: #d4d4d4; margin-left: 12px; width: 16px; }

.empty { padding: 56px 0; text-align: center; }
.empty-icon { width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: #a3a3a3; }
.empty-title { font-size: 13px; font-weight: 500; color: #0a0a0c; margin-bottom: 2px; }
.empty-sub { font-size: 12px; color: #737373; }
</style>
</head><body>

<div class="page-label">Bots list — Linear register: dense, one row height, scannable</div>
<div class="shell">
  <div class="sidebar">
    <div class="brand-row">
      <div class="brand-icon"><svg width="12" height="12" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12c0 4.418-4.03 8-9 8-1.17 0-2.29-.2-3.31-.56L3 21l1.56-4.69C3.57 15.06 3 13.58 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
      <div class="brand-name">Chatter</div>
    </div>
    <div class="nav-item">Bots</div>
  </div>

  <div class="main">
    <div class="main-header">
      <div class="page-title">Bots<span class="bot-count">3</span></div>
      <div class="new-bot-row">
        <input class="field-input-sm" placeholder="Bot name" readonly value="Support bot"/>
        <button class="btn-sm">New bot</button>
      </div>
    </div>

    <div class="list">
      <div class="thead-row">
        <div class="th-name">Name</div>
        <div class="th-status">Status</div>
        <div class="th-created">Created</div>
        <div style="width:28px;"></div>
      </div>
      <div class="row">
        <div class="row-name"><div class="row-icon">SB</div>Support bot</div>
        <div class="row-status"><span class="badge badge-published">Published</span></div>
        <div class="row-meta">2h ago</div>
        <div class="row-chevron">›</div>
      </div>
      <div class="row">
        <div class="row-name"><div class="row-icon">SC</div>Sales concierge</div>
        <div class="row-status"><span class="badge badge-published">Published</span></div>
        <div class="row-meta">1d ago</div>
        <div class="row-chevron">›</div>
      </div>
      <div class="row">
        <div class="row-name"><div class="row-icon">TB</div>Test 1</div>
        <div class="row-status"><span class="badge badge-draft">Draft only</span></div>
        <div class="row-meta">just now</div>
        <div class="row-chevron">›</div>
      </div>
    </div>
  </div>
</div>

<div class="page-label">Empty state</div>
<div class="shell" style="height:320px;">
  <div class="sidebar">
    <div class="brand-row">
      <div class="brand-icon"><svg width="12" height="12" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12c0 4.418-4.03 8-9 8-1.17 0-2.29-.2-3.31-.56L3 21l1.56-4.69C3.57 15.06 3 13.58 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
      <div class="brand-name">Chatter</div>
    </div>
    <div class="nav-item">Bots</div>
  </div>
  <div class="main">
    <div class="main-header">
      <div class="page-title">Bots</div>
      <div class="new-bot-row">
        <input class="field-input-sm" placeholder="Bot name"/>
        <button class="btn-sm">New bot</button>
      </div>
    </div>
    <div class="empty">
      <div class="empty-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12c0 4.418-4.03 8-9 8-1.17 0-2.29-.2-3.31-.56L3 21l1.56-4.69C3.57 15.06 3 13.58 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
      <div class="empty-title">No bots yet</div>
      <div class="empty-sub">Create one above to get started.</div>
    </div>
  </div>
</div>

</body></html>
