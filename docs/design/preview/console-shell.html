<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* Values hardcoded here for a throwaway static preview — the real
   tokens live in app/globals.css and are what components/console/
   AppSidebar.tsx + app/(console)/layout.tsx actually reference (the
   real CARE Sidebar, components/ui/sidebar.tsx, ADR 0008/0009). */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e5e7eb; }
.page-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e5e5e5; color: #065f46; display: flex; justify-content: space-between; align-items: center; }
.sep { height: 1px; background: #d1d5db; }

.shell { display: flex; height: 420px; background: #f5f5f5; }
.sidebar { flex-shrink: 0; padding: 4px 4px 4px 8px; display: flex; flex-direction: column; transition: width 0.2s; }
.sidebar.expanded { width: 224px; }
.sidebar.collapsed { width: 56px; }
.brand-row { display: flex; align-items: center; gap: 8px; padding: 8px; }
.brand-icon { width: 22px; height: 22px; background: #065f46; border-radius: 6px; flex-shrink: 0; }
.nav-item { position: relative; height: 32px; margin-top: 4px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: #0a0a0c; font-weight: 500; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.nav-item::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: #059669; border-radius: 9999px 0 0 9999px; }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; border-radius: 3px; background: #d4d4d4; }
.footer { margin-top: auto; padding: 0 10px; height: 32px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #065f46; font-weight: 500; }

.main { flex: 1; margin: 8px 8px 8px 0; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
.topbar { height: 40px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 16px; }
.trigger { width: 28px; height: 28px; border: 1px solid #e5e5e5; border-radius: 6px; }
.content { padding: 24px 32px; color: #a3a3a3; font-size: 13px; }
</style>
</head><body>

<div class="page-label"><span>Console shell — expanded</span><span>components/console/AppSidebar.tsx</span></div>
<div class="shell">
  <div class="sidebar expanded">
    <div class="brand-row"><div class="brand-icon"></div></div>
    <div class="nav-item"><div class="nav-icon"></div>Bots</div>
    <div class="footer"><div class="nav-icon" style="background:none;border:1.5px solid #065f46;"></div>Log out</div>
  </div>
  <div class="main">
    <div class="topbar"><div class="trigger"></div></div>
    <div class="content">Page content renders here — unchanged per page.</div>
  </div>
</div>

<div class="sep"></div>

<div class="page-label"><span>Console shell — icon-collapsed</span><span>SidebarTrigger toggles, state persists via cookie</span></div>
<div class="shell">
  <div class="sidebar collapsed">
    <div class="brand-row" style="justify-content:center;padding:8px 0;"><div class="brand-icon"></div></div>
    <div class="nav-item" style="justify-content:center;padding:0;"><div class="nav-icon"></div></div>
    <div class="footer" style="justify-content:center;padding:0;"><div class="nav-icon" style="background:none;border:1.5px solid #065f46;"></div></div>
  </div>
  <div class="main">
    <div class="topbar"><div class="trigger"></div></div>
    <div class="content">Page content renders here — unchanged per page.</div>
  </div>
</div>

</body></html>
